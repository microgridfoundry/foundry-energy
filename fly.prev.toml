# Prev (preview) instance: https://prev.foundry.energy
# Scales to zero when idle and is never indexed (APP_ENV=prev → noindex + robots.txt Disallow).
# Deploy any branch with: fly deploy -c fly.prev.toml --remote-only
app = "foundry-energy-mgf-prev"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  APP_ENV = "prev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
